name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -v
      - name: Syntax and CLI smoke check
        run: |
          python -m compileall -q -x '(^|/)\.(git|venv)(/|$)' .
          python eversmart.py --help
      - name: Build and smoke-test the installed CLI
        run: |
          python -m pip install .
          (cd "$RUNNER_TEMP" && eversmart --help)
