[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eversmart"
version = "0.1.0"
description = "Authenticated Eversource smart-meter retrieval and dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
eversmart = "eversmart:main"

[tool.setuptools]
py-modules = ["eversmart", "dashboard", "history", "runtime", "queries", "cookie_convert"]
